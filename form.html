<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <fieldset>
        <form action="./response.html" >
            <label for="name">UserName:</label>
            <input type="text" name="name" id="name" placeholder="Enter your name">

             <br><br>
            <label for="pass">Password:</label>
            <input type="password" name="pass" id="pass" placeholder="Enter your Password">

             <br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="Enter your email">

            <br><br>
            <label for="gender">Gender:</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">Male:</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">Female</label>

            <br><br>
            <label for="hobb">Hobbies:</label>
            <input type="checkbox" name="hobb1" id="hobb1">
            <label for="hobb1">Cricket</label>
            <input type="checkbox" name="hobb2" id="hobb2">
            <label for="hobb2">Football</label>

            <br><br>
            <label for="dob">DOB:</label>
            <input type="date" name="dob" id="dob">

            <br><br>
            <label for="lang">Select Programming Language</label>
            <select name="lang" id="lang">
                <option value="">Select lang</option>
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="Python">Python</option>
                <option value="JAVA">JAVA</option>
            </select>
            <br><br>
            <label for="tel">Phone:</label>
            <input type="tel" name="tel" id="tel">
            <br><br>
            <label for="add">Adress:</label>
            <textarea name="add" id="add"></textarea>

             <br><br>
            <label for="attmpt">Attempt:</label>
            <input type="number" name="attmpt" id="attmpt">

            <br><br>
            <label for="res">Upload resume:</label>
            <input type="file" name="res" id="res">

            <br><br>
            <label for="url">homepage</label>
            <input type="url" name="url" id="url">
            <br><br>
            <input type="submit" value="Submit form">
            <input type="reset">







        </form>
    </fieldset>
</body>
</html>
